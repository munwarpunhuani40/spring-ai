spring:
  application:
    name: "help-desk-backend"
#  Database configuration
  datasource:
    url: jdbc:mysql://localhost:3306/help_desk?createDatabaseIfNotExist=true
    username: root
    password: root1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

server:
  port: 8083

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG